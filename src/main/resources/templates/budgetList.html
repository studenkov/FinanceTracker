<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджеты — Finance tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/accounts">Мои счета</a>
        <a href="/transactions">Транзакции</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="/admin" sec:authorize="hasAuthority('ADMIN')">Админ Панель</a>
        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0; display: inline;">
            <button type="submit" class="btn btn-secondary btn-sm" style="background: var(--color-expense); color: white; border: none; padding: 6px 12px; margin-left: 16px;">
                Выход
            </button>
        </form>
    </nav>
</header>


<main>
    <section class="card-section">
        <h2>Мои Бюджеты</h2>

        <div class="card add-card">
            <form th:action="@{/budgets/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Категория</label>
                        <select name="category.id" required>
                            <option value="" disabled selected>Выберите категорию</option>
                            <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Лимит (₽)</label>
                        <input type="number" step="0.01" name="limitAmount" required>
                    </div>

                    <div class="form-group">
                        <label>Начало</label>
                        <input type="date" name="startDate" required>
                    </div>

                    <div class="form-group">
                        <label>Конец</label>
                        <input type="date" name="endDate" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Установить лимит</button>
                </div>
            </form>
        </div>

        <div class="card table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Категория</th>
                    <th>Лимит</th>
                    <th>Период</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="budget : ${budgets}">
                    <td th:text="${budget.id}"></td>
                    <td th:text="${budget.category?.title}"></td>
                    <td th:text="${budget.limitAmount} + ' ₽'"></td>
                    <td>
                        <span th:text="${budget.startDate}"></span> — <span th:text="${budget.endDate}"></span>
                    </td>
                    <td>
                        <form th:action="@{/budgets/delete/{id}(id=${budget.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px;">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
