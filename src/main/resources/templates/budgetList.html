<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджеты</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="#">Настройки</a>
    </nav>
</header>

<main>
    <section class="card-section">
        <h2>Управление бюджетами</h2>

        <div class="card add-card">
            <form th:action="@{/budgets/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="categoryId">Категория (ID)</label>
                        <input type="number" id="categoryId" name="categoryId" placeholder="ID" required style="width: 80px;">
                    </div>
                    <div class="form-group">
                        <label for="limitAmount">Лимит (₽)</label>
                        <input type="number" step="0.01" id="limitAmount" name="limitAmount" placeholder="50000" required style="width: 150px;">
                    </div>
                    <div class="form-group">
                        <label for="startDate">Начало</label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">Конец</label>
                        <input type="date" id="endDate" name="endDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Установить лимит</button>
                </div>
            </form>
        </div>

        <div class="card table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Категория</th>
                    <th>Лимит</th>
                    <th>Период</th>
                    <th>Действие</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(budgets)}">
                    <td colspan="5" class="empty-state">Бюджеты еще не установлены</td>
                </tr>
                <tr th:each="budget : ${budgets}">
                    <td th:text="${budget.id}"></td>
                    <td th:text="${budget.categoryId}"></td>
                    <td th:text="${budget.limitAmount} + ' ₽'"></td>
                    <td>
                        <span th:text="${budget.startDate}"></span> —
                        <span th:text="${budget.endDate}"></span>
                    </td>
                    <td>
                        <form th:action="@{/budgets/delete/{id}(id=${budget.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px;">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: center; gap: 10px; align-items: center;">
            <a th:if="${currentPage > 0}"
               th:href="@{/budgets(page=${currentPage - 1})}"
               class="btn btn-secondary" style="text-decoration: none;">Назад</a>

            <span style="font-weight: 600;">Страница <span th:text="${currentPage + 1}">1</span></span>

            <a th:if="${hasNext}"
               th:href="@{/budgets(page=${currentPage + 1})}"
               class="btn btn-secondary" style="text-decoration: none;">Вперед</a>
        </div>
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
