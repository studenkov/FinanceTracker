<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::#page-content})}">
<head><title>Пользователи</title></head>
<body>
<div id="page-content" class="card table-container admin-section active">
    <h3 class="admin-section-title">Управление Пользователями</h3>
    <div class="admin-form-container">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
            <button class="btn btn-primary" onclick="toggleForm('form-add')">Добавить пользователя</button>
            <form th:action="@{/admin/users}" method="get" class="form-row" style="margin-bottom: 0;">
                <div class="form-group"><input type="text" name="query" th:value="${query}" placeholder="Поиск..." required></div>
                <button type="submit" class="btn btn-secondary">Искать</button>
                <a th:if="${not #strings.isEmpty(query)}" th:href="@{/admin/users}" class="btn btn-secondary" style="text-decoration: none;">Сброс</a>
            </form>
        </div>
        <form id="form-add" class="add-form" th:action="@{/admin/users/add}" method="post" th:style="${errorMessage != null ? 'display: block;' : 'display: none;'}">
            <div class="form-row">
                <div class="form-group"><label>Username</label><input type="text" name="username" th:value="${entityModel?.username}" required></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" th:value="${entityModel?.email}" required></div>
                <div class="form-group"><label>Nickname</label><input type="text" name="nickname" th:value="${entityModel?.nickname}" required></div>
                <div class="form-group"><label>Role ID</label><input type="number" name="roleId" th:value="${entityModel?.roleId}" required></div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Username</th><th>Password</th><th>Email</th><th>Никнейм</th><th>Role ID</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="i : ${data.content}">
            <td th:text="${i.id}"></td>
            <td class="read-mode" th:text="${i.username}"></td><td class="read-mode">***</td><td class="read-mode" th:text="${i.email}"></td><td class="read-mode" th:text="${i.nickname}"></td><td class="read-mode" th:text="${i.roleId}"></td>
            <td class="edit-mode hidden" colspan="5">
                <form th:action="@{/admin/users/update}" method="post">
                    <input type="hidden" name="id" th:value="${i.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}">
                    <input type="text" name="username" th:value="${i.username}" required><input type="password" name="password" th:value="${i.password}" required><input type="email" name="email" th:value="${i.email}" required><input type="text" name="nickname" th:value="${i.nickname}" required><input type="number" name="roleId" th:value="${i.roleId}" required>
                    <button type="submit" class="btn btn-primary btn-sm">OK</button><button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">Отменить</button>
                </form>
            </td>
            <td class="action-btns read-mode">
                <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
                <form th:action="@{/admin/users/delete}" method="post" onsubmit="return confirm('Вы уверены?');"><input type="hidden" name="id" th:value="${i.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}"><button type="submit" class="btn-sm btn-danger">Удалить</button></form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{admin/fragments/pagination :: paging('/admin/users')}"></div>
</div>
</body>
</html>
