<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::#page-content})}">
<head><title>Повторяющиеся транзакции</title></head>
<body>
<div id="page-content" class="card table-container admin-section active">
    <h3 class="admin-section-title">Повторяющиеся Транзакции</h3>
    <div class="admin-form-container">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
            <button class="btn btn-primary" onclick="toggleForm('form-add')">Добавить</button>
            <form th:action="@{/admin/recurring}" method="get" class="form-row" style="margin-bottom: 0;">
                <div class="form-group">
                    <select name="query" required class="btn-edit" style="padding: 9px 14px; border-radius: 10px; font-size: 15px;">
                        <option value="true" th:selected="${query == 'true'}">Активные</option>
                        <option value="false" th:selected="${query == 'false'}">Неактивные</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-secondary">Искать</button>
                <a th:if="${not #strings.isEmpty(query)}" th:href="@{/admin/recurring}" class="btn btn-secondary" style="text-decoration: none;">Сброс</a>
            </form>
        </div>
        <form id="form-add" class="add-form" th:action="@{/admin/recurring/add}" method="post" th:style="${errorMessage != null ? 'display: block;' : 'display: none;'}">
            <div class="form-row">
                <div class="form-group"><label>Сумма</label><input type="number" step="0.01" name="amount" th:value="${entityModel?.amount}" required></div>
                <div class="form-group"><label>След. дата</label><input type="date" name="nextDate" th:value="${entityModel?.nextDate}" required></div>
                <div class="form-group">
                    <label>Активен</label>
                    <select name="isActive" required>
                        <option value="true" th:selected="${entityModel?.isActive == true}">Да</option>
                        <option value="false" th:selected="${entityModel?.isActive == false}">Нет</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select name="category.id" required>
                        <option value="" disabled selected>Выберите категорию</option>
                        <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.title}" th:selected="${entityModel?.category?.id == c.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Частота</label>
                    <select name="frequency.id" required>
                        <option value="" disabled selected>Выберите частоту</option>
                        <option th:each="f : ${allFrequencies}" th:value="${f.id}" th:text="${f.title}" th:selected="${entityModel?.frequency?.id == f.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Счет</label>
                    <select name="account.id" required>
                        <option value="" disabled selected>Выберите счет</option>
                        <option th:each="a : ${allAccounts}" th:value="${a.id}" th:text="${a.title}" th:selected="${entityModel?.account?.id == a.id}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Сумма</th><th>Дата</th><th>Активен</th><th>Категория</th><th>Частота</th><th>Счет</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="i : ${data.content}">
            <td th:text="${i.id}"></td>
            <td class="read-mode" th:text="${i.amount}"></td>
            <td class="read-mode" th:text="${i.nextDate}"></td>
            <td class="read-mode" th:text="${i.isActive ? 'Да' : 'Нет'}"></td>
            <td class="read-mode" th:text="${i.category?.title}"></td>
            <td class="read-mode" th:text="${i.frequency?.title}"></td>
            <td class="read-mode" th:text="${i.account?.title}"></td>
            <td class="edit-mode hidden" colspan="6">
                <form th:action="@{/admin/recurring/update}" method="post">
                    <input type="hidden" name="id" th:value="${i.id}">
                    <input type="hidden" name="currentPage" th:value="${data.number}">
                    <input type="hidden" name="query" th:value="${query}">
                    <input type="number" step="0.01" name="amount" th:value="${i.amount}" required>
                    <input type="date" name="nextDate" th:value="${i.nextDate}" required>
                    <select name="isActive" required>
                        <option value="true" th:selected="${i.isActive}">Да</option>
                        <option value="false" th:selected="${!i.isActive}">Нет</option>
                    </select>
                    <select name="category.id" required>
                        <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.title}" th:selected="${i.category?.id == c.id}"></option>
                    </select>
                    <select name="frequency.id" required>
                        <option th:each="f : ${allFrequencies}" th:value="${f.id}" th:text="${f.title}" th:selected="${i.frequency?.id == f.id}"></option>
                    </select>
                    <select name="account.id" required>
                        <option th:each="a : ${allAccounts}" th:value="${a.id}" th:text="${a.title}" th:selected="${i.account?.id == a.id}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">OK</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">X</button>
                </form>
            </td>
            <td class="action-btns read-mode">
                <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
                <form th:action="@{/admin/recurring/delete}" method="post" onsubmit="return confirm('Вы уверены?');">
                    <input type="hidden" name="id" th:value="${i.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}"><button type="submit" class="btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{admin/fragments/pagination :: paging('/admin/recurring')}"></div>
</div>
</body>
</html>
