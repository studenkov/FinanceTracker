<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::#page-content})}">
<head><title>Категории</title></head>
<body>
<div id="page-content" class="card table-container admin-section active">
    <h3 class="admin-section-title">Управление Категориями</h3>
    <div class="admin-form-container">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
            <button class="btn btn-primary" onclick="toggleForm('form-add')">Добавить категорию</button>
            <form th:action="@{/admin/categories}" method="get" class="form-row" style="margin-bottom: 0;">
                <div class="form-group"><input type="text" name="query" th:value="${query}" placeholder="Поиск..." required></div>
                <button type="submit" class="btn btn-secondary">Искать</button>
                <a th:if="${not #strings.isEmpty(query)}" th:href="@{/admin/categories}" class="btn btn-secondary" style="text-decoration: none;">Сброс</a>
            </form>
        </div>
        <form id="form-add" class="add-form" th:action="@{/admin/categories/add}" method="post" th:style="${errorMessage != null ? 'display: block;' : 'display: none;'}">
            <div class="form-row">
                <div class="form-group"><label>Название</label><input type="text" name="title" th:value="${entityModel?.title}" required></div>
                <div class="form-group">
                    <label>Тип</label>
                    <select name="type.id" required>
                        <option value="" disabled selected>Выберите тип</option>
                        <option th:each="t : ${allTypes}" th:value="${t.id}" th:text="${t.title}" th:selected="${entityModel?.type?.id == t.id}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Пользователь</label>
                    <select name="user.id" required>
                        <option value="" disabled selected>Выберите пользователя</option>
                        <option th:each="u : ${allUsers}" th:value="${u.id}" th:text="${u.username}" th:selected="${entityModel?.user?.id == u.id}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Пользователь</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="i : ${data.content}">
            <td th:text="${i?.id}"></td>
            <td class="read-mode" th:text="${i?.title}"></td>
            <td class="read-mode" th:text="${i?.type?.title}"></td>
            <td class="read-mode" th:text="${i?.user?.username}"></td>
            <td class="edit-mode hidden" colspan="3">
                <form th:action="@{/admin/categories/update}" method="post">
                    <input type="hidden" name="id" th:value="${i?.id}">
                    <input type="hidden" name="currentPage" th:value="${data.number}">
                    <input type="hidden" name="query" th:value="${query}">
                    <input type="text" name="title" th:value="${i?.title}" required>
                    <select name="type.id" required>
                        <option th:each="t : ${allTypes}" th:value="${t.id}" th:text="${t.title}" th:selected="${i?.type?.id == t.id}"></option>
                    </select>
                    <select name="user.id" required>
                        <option th:each="u : ${allUsers}" th:value="${u.id}" th:text="${u.username}" th:selected="${i?.user?.id == u.id}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-sm">OK</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">X</button>
                </form>
            </td>
            <td class="action-btns read-mode">
                <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
                <form th:action="@{/admin/categories/delete}" method="post" onsubmit="return confirm('Вы уверены?');">
                    <input type="hidden" name="id" th:value="${i?.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}"><button type="submit" class="btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{admin/fragments/pagination :: paging('/admin/categories')}"></div>
</div>
</body>
</html>
