<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::#page-content})}">
<head><title>Роли</title></head>
<body>
<div id="page-content" class="card table-container admin-section active">
    <h3 class="admin-section-title">Управление Ролями</h3>
    <div class="admin-form-container">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
            <button class="btn btn-primary" onclick="toggleForm('form-add')">Добавить роль</button>
            <form th:action="@{/admin/roles}" method="get" class="search-bar">
                <div class="form-group">
                    <input type="text" name="query" th:value="${query}" placeholder="Поиск...">
                </div>
                <button type="submit" class="btn btn-secondary">Искать</button>
                <a th:if="${not #strings.isEmpty(query)}" th:href="@{/admin/roles}" class="btn btn-secondary" style="text-decoration: none;">Сброс</a>
            </form>
        </div>
        <form id="form-add" class="add-form" th:action="@{/admin/roles/add}" method="post" th:style="${errorMessage != null ? 'display: block;' : 'display: none;'}">
            <div class="form-row">
                <div class="form-group"><label>Роль</label><input type="text" name="role" th:value="${entityModel?.role}" required></div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Роль</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="i : ${data.content}">
            <td th:text="${i.id}"></td>
            <td class="read-mode" th:text="${i.role}"></td>
            <td class="edit-mode hidden">
                <form th:action="@{/admin/roles/update}" method="post">
                    <input type="hidden" name="id" th:value="${i.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}">
                    <input type="text" name="role" th:value="${i.role}" required>
                    <button type="submit" class="btn btn-primary btn-sm">OK</button><button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">X</button>
                </form>
            </td>
            <td class="action-btns read-mode">
                <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
                <form th:action="@{/admin/roles/delete}" method="post" onsubmit="return confirm('Вы уверены?');"><input type="hidden" name="id" th:value="${i.id}"><input type="hidden" name="currentPage" th:value="${data.number}"><input type="hidden" name="query" th:value="${query}"><button type="submit" class="btn-sm btn-danger">Удалить</button></form>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:replace="~{admin/fragments/pagination :: paging('/admin/roles')}"></div>
</div>
</body>
</html>
