<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::#page-content})}">
<head><title>Роли пользователей</title></head>
<body>
<div id="page-content" class="card table-container admin-section active">
    <h3 class="admin-section-title">Управление Ролями Пользователей</h3>

    <div class="admin-form-container">
        <div style="display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-end;">
            <form th:action="@{/admin/roles}" method="get" class="search-bar">
                <div class="form-group">
                    <input type="text" name="query" th:value="${query}" placeholder="Поиск по логину...">
                </div>
                <button type="submit" class="btn btn-secondary">Искать</button>
                <a th:if="${not #strings.isEmpty(query)}" th:href="@{/admin/roles}" class="btn btn-secondary" style="text-decoration: none;">Сброс</a>
            </form>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Пользователь</th>
            <th>Роли</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${data.content}">
            <td th:text="${i.id}"></td>
            <td th:text="${i.username}"></td>

            <td class="read-mode" th:text="${i.roles}"></td>

            <td class="edit-mode hidden">
                <form th:action="@{/admin/roles/update}" method="post" style="display: flex; gap: 10px; align-items: center;">
                    <input type="hidden" name="id" th:value="${i.id}">
                    <input type="hidden" name="currentPage" th:value="${data.number}">
                    <input type="hidden" name="query" th:value="${query}">

                    <div style="display: flex; gap: 8px;">
                        <label th:each="role : ${T(org.kaorun.financetracker.model.RoleEnum).values()}" style="display: flex; align-items: center; gap: 4px; font-size: 13px;">
                            <input type="checkbox" name="roles[]" th:value="${role}" th:checked="${i.roles.contains(role)}">
                            <span th:text="${role}"></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm">OK</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">X</button>
                </form>
            </td>

            <td class="action-btns read-mode">
                <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:replace="~{admin/fragments/pagination :: paging('/admin/roles')}"></div>
</div>
</body>
</html>
