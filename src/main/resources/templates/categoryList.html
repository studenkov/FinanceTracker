<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории — Finance tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/accounts">Мои счета</a>
        <a href="/transactions">Транзакции</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="/admin" sec:authorize="hasAuthority('ADMIN')">Админ Панель</a>
        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0; display: inline;">
            <button type="submit" class="btn btn-secondary btn-sm" style="background: var(--color-expense); color: white; border: none; padding: 6px 12px; margin-left: 16px;">
                Выход
            </button>
        </form>
    </nav>
</header>

<main>
    <section class="card-section">
        <h2>Категории</h2>

        <div class="card search-card">
            <form th:action="@{/categories}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="search-title">Поиск по ID или названию</label>
                        <input type="text" id="search-title" name="query" th:value="${query}" placeholder="Введите ID или название...">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Найти</button>
                        <a th:href="@{/categories}" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Сбросить</a>
                    </div>
                </div>
            </form>
        </div>

        <div class="card add-card">
            <form th:action="@{/categories/add}" method="post" th:object="${category}">
                <div class="form-row">
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" th:field="*{title}" placeholder="Название категории" required>
                    </div>
                    <div class="form-group">
                        <label>Тип</label>
                        <select name="type.id" required>
                            <option value="" disabled selected>Выберите тип</option>
                            <option th:each="t : ${allTypes}" th:value="${t.id}" th:text="${t.title}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Пользователь</label>
                        <select name="user.id" required>
                            <option value="" disabled selected>Выберите пользователя</option>
                            <option th:each="u : ${allUsers}" th:value="${u.id}" th:text="${u.username}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>

        <div class="card table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Пользователь</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="empty-state">Категории не найдены</td>
                </tr>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.title}"></td>
                    <td th:text="${cat.type?.title}"></td>
                    <td th:text="${cat.user?.username}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${query == null or query.isEmpty()}"
             style="margin-top: 24px; display: flex; justify-content: center; gap: 10px; align-items: center;">
            <a th:if="${currentPage > 0}" th:href="@{/categories(page=${currentPage - 1})}" class="btn btn-secondary" style="text-decoration: none;">Назад</a>
            <span style="font-weight: 600;">Страница <span th:text="${currentPage + 1}">1</span></span>
            <a th:if="${categories.size() == 10}" th:href="@{/categories(page=${currentPage + 1})}" class="btn btn-secondary" style="text-decoration: none;">Вперед</a>
        </div>
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
