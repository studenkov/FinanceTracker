<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовые Цели — Finance tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/accounts">Мои счета</a>
        <a href="/transactions">Транзакции</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="/admin" sec:authorize="hasAuthority('ADMIN')">Админ Панель</a>
        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0; display: inline;">
            <button type="submit" class="btn btn-secondary btn-sm" style="background: var(--color-expense); color: white; border: none; padding: 6px 12px; margin-left: 16px;">
                Выход
            </button>
        </form>
    </nav>
</header>

<main>
    <section class="card-section">
        <h2>Финансовые цели</h2>

        <div class="card add-card">
            <form th:action="@{/goals/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" name="title" required>
                    </div>

                    <div class="form-group">
                        <label>Цель (₽)</label>
                        <input type="number" step="0.01" name="targetAmount" required>
                    </div>

                    <div class="form-group">
                        <label>Накоплено (₽)</label>
                        <input type="number" step="0.01" name="currentAmount" value="0">
                    </div>

                    <div class="form-group">
                        <label>Счёт</label>
                        <select name="account.id" required>
                            <option value="" disabled selected>Выберите счёт</option>
                            <option th:each="a : ${allAccounts}" th:value="${a.id}" th:text="${a.title}"></option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Создать</button>
                </div>
            </form>
        </div>

        <div class="card table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название цели</th>
                    <th>Цель (₽)</th>
                    <th>Накоплено (₽)</th>
                    <th>Счёт</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="goal : ${goals}">
                    <td th:text="${goal.id}"></td>
                    <td th:text="${goal.title}"></td>
                    <td th:text="${goal.targetAmount}"></td>
                    <td th:text="${goal.currentAmount}"></td>
                    <td>
                        <span th:text="${goal.account?.title}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
