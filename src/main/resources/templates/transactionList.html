<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции — Finance tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="#">Настройки</a>
    </nav>
</header>

<main>
    <section class="card-section">
        <h2>Транзакции</h2>

        <div class="card search-card">
            <form th:action="@{/transactions}" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="search-query">Поиск по ID или заметке</label>
                        <input type="text" id="search-query" name="query" th:value="${query}" placeholder="Введите ID или заметку...">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Найти</button>
                        <a th:href="@{/transactions}" class="btn btn-secondary" style="text-decoration: none; display: inline-block;">Сбросить</a>
                    </div>
                </div>
            </form>
        </div>

        <div class="card add-card">
            <form th:action="@{/transactions/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="categoryId">ID категории</label>
                        <input type="number" id="categoryId" name="categoryId" placeholder="1" min="1" required style="width: 120px;">
                    </div>
                    <div class="form-group">
                        <label for="date">Дата</label>
                        <input type="date" id="date" name="date" required style="width: 150px;">
                    </div>
                    <div class="form-group">
                        <label for="note">Заметка</label>
                        <input type="text" id="note" name="note" placeholder="Описание транзакции">
                    </div>
                    <div class="form-group">
                        <label for="amount">Сумма</label>
                        <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" required style="width: 120px;">
                    </div>
                    <div class="form-group">
                        <label for="accountId">ID счёта</label>
                        <input type="number" id="accountId" name="accountId" placeholder="1" min="1" required style="width: 100px;">
                    </div>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>

        <div class="card table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>ID категории</th>
                    <th>Дата</th>
                    <th>Заметка</th>
                    <th>Сумма</th>
                    <th>ID счёта</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="6" class="empty-state">Транзакции не найдены</td>
                </tr>
                <tr th:each="t : ${transactions}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.categoryId}"></td>
                    <td th:text="${t.date}"></td>
                    <td th:text="${t.note}"></td>
                    <td th:text="${t.amount}"></td>
                    <td th:text="${t.accountId}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${query == null or query.isEmpty()}"
             style="margin-top: 24px; display: flex; justify-content: center; gap: 10px; align-items: center;">

            <a th:if="${currentPage > 0}"
               th:href="@{/transactions(page=${currentPage - 1})}"
               class="btn btn-secondary" style="text-decoration: none;">Назад</a>

            <span style="font-weight: 600;">Страница <span th:text="${currentPage + 1}">1</span></span>

            <a th:if="${transactions.size() == 10}"
               th:href="@{/transactions(page=${currentPage + 1})}"
               class="btn btn-secondary" style="text-decoration: none;">Вперед</a>
        </div>
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
