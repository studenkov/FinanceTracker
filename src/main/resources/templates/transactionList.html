<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции — Finance tracker</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Finance tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/accounts">Мои счета</a>
        <a href="/transactions">Транзакции</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>

        <a href="/admin" sec:authorize="hasAuthority('ADMIN')">Админ Панель</a>

        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0; display: inline;">
            <button type="submit" class="btn btn-secondary btn-sm" style="background: var(--color-expense); color: white; border: none; padding: 6px 12px; margin-left: 16px;">
                Выход
            </button>
        </form>
    </nav>
</header>

<main>
    <section class="card-section">
        <h2>Транзакции</h2>

        <div class="card add-card">
            <form th:action="@{/transactions/add}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Категория</label>
                        <select name="category.id" required>
                            <option value="" disabled selected>Выберите категорию</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Счёт</label>
                        <select name="account.id" required>
                            <option value="" disabled selected>Выберите счёт</option>
                            <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.title}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Дата</label>
                        <input type="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label>Сумма</label>
                        <input type="number" name="amount" step="0.01" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>

       
    </section>
</main>

<footer>
    © 2026 Finance tracker
</footer>

</body>
</html>
