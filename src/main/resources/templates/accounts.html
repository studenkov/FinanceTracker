<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Мои счета</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header>
    <h1>Finance Tracker</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/accounts">Мои счета</a>
        <a href="/transactions">Транзакции</a>
        <a href="/budgets">Финансы</a>
        <a href="/categories">Категории</a>
        <a href="/goals">Цели</a>
        <a href="/admin" sec:authorize="hasAuthority('ADMIN')">Админ Панель</a>
        <form th:action="@{/logout}" method="post" style="margin: 0; padding: 0; display: inline;">
            <button type="submit" class="btn btn-secondary btn-sm" style="background: var(--color-expense); color: white; border: none; padding: 6px 12px; margin-left: 16px;">
                Выход
            </button>
        </form>
    </nav>
</header>

<main>
    <div class="card-section">
        <h2>Управление кошельками</h2>

        <div class="card add-card">
            <form th:action="@{/accounts/add}" th:object="${accountModel}" method="post" class="form-row">
                <div class="form-group">
                    <label>Название кошелька</label>
                    <input type="text" th:field="*{title}" placeholder="Название" required>
                </div>

                <div class="form-group">
                    <label>Начальный баланс</label>
                    <input type="number" step="0.01" th:field="*{balance}" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Валюта</label>
                    <select th:field="*{currency}" required>
                        <option value="" disabled selected>Выберите валюту</option>
                        <option th:each="c : ${allCurrencies}" th:value="${c.id}" th:text="${c.title}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" style="height: 42px;">Создать счет</button>
                </div>
            </form>
        </div>

        <h3 style="margin: 32px 0 16px 0; color: var(--color-accent);">Ваши счета:</h3>

        <div th:if="${#lists.isEmpty(accounts)}" style="color: #666;">
            У вас пока нет ни одного счета. Создайте первый!
        </div>

        <table th:if="${!#lists.isEmpty(accounts)}" class="admin-table" style="width: 100%; border-collapse: collapse; margin-top: 16px;">
            <thead>
            <tr style="text-align: left; border-bottom: 2px solid var(--color-accent);">
                <th>ID</th>
                <th>Название</th>
                <th>Баланс</th>
                <th>Валюта</th>
                <th style="text-align: right;">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="acc : ${accounts}">
                <td th:text="${acc.id}"></td>

                <td class="read-mode" th:text="${acc.title}"></td>
                <td class="read-mode" th:text="${acc.balance}"></td>
                <td class="read-mode" th:text="${acc.currency?.title}"></td>

                <td class="edit-mode hidden" colspan="3">
                    <form th:action="@{/accounts/add}" method="post" style="display: flex; gap: 10px; align-items: center; width: 100%;">
                        <input type="hidden" name="id" th:value="${acc.id}">
                        <input type="text" name="title" th:value="${acc.title}" required style="flex: 1;">
                        <input type="number" step="0.01" name="balance" th:value="${acc.balance}" required style="max-width: 100px;">

                        <select name="currency" required>
                            <option th:each="c : ${allCurrencies}"
                                    th:value="${c.id}"
                                    th:text="${c.title}"
                                    th:selected="${c.id == acc.currency?.id}"></option>
                        </select>

                        <button type="submit" class="btn btn-primary btn-sm">OK</button>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="toggleEdit(this, false)">X</button>
                    </form>
                </td>

                <td class="action-btns read-mode" style="text-align: right;">
                    <button class="btn-sm btn-edit" onclick="toggleEdit(this, true)">Изменить</button>
                    <form th:action="@{/accounts/delete}" method="post" onsubmit="return confirm('Вы уверены?');" style="margin: 0; display: inline-block;">
                        <input type="hidden" name="id" th:value="${acc.id}">
                        <button type="submit" class="btn-sm btn-danger" style="background-color: var(--color-expense);">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    function toggleEdit(btn, editMode) {
        const tr = btn.closest('tr');
        const readElements = tr.querySelectorAll('.read-mode');
        const editElement = tr.querySelector('.edit-mode');

        if (editMode) {
            readElements.forEach(el => el.classList.add('hidden'));
            editElement.classList.remove('hidden');
        } else {
            readElements.forEach(el => el.classList.remove('hidden'));
            editElement.classList.add('hidden');
        }
    }
</script>
</body>
</html>
